name = "medexera-attendance"
pages_build_output_dir = "public"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "medexera-attendance-db"
database_id = "bc96ceda-5f0e-4a5b-bde7-a7749d1dc893"
migrations_dir = "migrations"

# Keep preview deployments isolated from production data.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "medexera-attendance-staging"
database_id = "4ea56850-6f8e-44fe-a6dd-d48f6eb16003"
migrations_dir = "migrations"

