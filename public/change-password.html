<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Change password · Medexera Attendance</title>
<style>:root{color-scheme:dark;--bg:#09090b;--line:#2c2512;--text:#f3ecd6;--muted:#b5a574;--gold:#f1d98a;--red:#d76a60}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 15%,#24200f 0,transparent 38%),radial-gradient(ellipse at 85% 80%,#171527 0,transparent 40%),var(--bg);color:var(--text);font:15px system-ui,sans-serif}.card{width:min(430px,100%);padding:32px;border:1px solid var(--line);border-radius:20px;background:#111114ef;box-shadow:0 24px 80px #0009}.brand{text-align:center;font:700 26px Georgia,serif;margin:0 0 8px;color:var(--gold)}p{color:var(--muted);text-align:center;margin:0 0 24px}label{display:block;margin:14px 0 6px;color:var(--muted);font-size:13px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#050506;color:var(--text);font:inherit}button{width:100%;padding:12px;margin-top:18px;border:1px solid #9e7726;border-radius:10px;background:linear-gradient(120deg,#a97a1c,#f1d98a);color:#171204;font:700 15px system-ui;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.message{min-height:22px;margin-top:12px;color:var(--red);text-align:center;font-size:13px}</style></head>
<body><main class="card"><h1 class="brand">Change your password</h1><p id="intro">Use your current password to set a new one. Passwords must be at least 8 characters.</p><form id="change"><label for="current">Current password</label><input id="current" type="password" autocomplete="current-password" required><label for="next">New password</label><input id="next" type="password" autocomplete="new-password" minlength="8" maxlength="256" required><label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="256" required><button id="submit">Change password</button><div class="message" id="message" role="status"></div></form><button type="button" id="logout" style="background:transparent;color:var(--gold)">Sign out</button></main>
<script>
const $=s=>document.querySelector(s),msg=t=>$('#message').textContent=t;
$('#change').addEventListener('submit',async event=>{event.preventDefault();const button=$('#submit');msg('');if($('#next').value!==$('#confirm').value){msg('The new passwords do not match');return}button.disabled=true;try{const response=await fetch('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({currentPassword:$('#current').value,newPassword:$('#next').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Unable to change password');location.replace('/index.html')}catch(error){msg(error.message||'Unable to change password')}finally{button.disabled=false}});
$('#logout').addEventListener('click',async()=>{try{await fetch('/api/auth/logout',{method:'POST'})}catch{}try{sessionStorage.removeItem('atxs')}catch{}location.replace('/login.html')});
</script></body></html>
