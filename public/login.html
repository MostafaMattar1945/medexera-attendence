<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medexera Attendance · Sign in</title>
<style>
:root{color-scheme:dark;--bg:#09090b;--card:#111114;--line:#2c2512;--text:#f3ecd6;--muted:#b5a574;--gold:#f1d98a;--red:#d76a60}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 15%,#24200f 0,transparent 38%),radial-gradient(ellipse at 85% 80%,#171527 0,transparent 40%),var(--bg);color:var(--text);font:15px system-ui,sans-serif}.card{width:min(430px,100%);padding:32px;border:1px solid var(--line);border-radius:20px;background:#111114ef;box-shadow:0 24px 80px #0009}.brand{text-align:center;font:700 26px Georgia,serif;margin:0 0 8px;color:var(--gold)}p{color:var(--muted);text-align:center;margin:0 0 24px}label{display:block;margin:14px 0 6px;color:var(--muted);font-size:13px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#050506;color:var(--text);font:inherit}button{width:100%;padding:12px;margin-top:18px;border:1px solid #9e7726;border-radius:10px;background:linear-gradient(120deg,#a97a1c,#f1d98a);color:#171204;font:700 15px system-ui;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.message{min-height:22px;margin-top:12px;color:var(--red);text-align:center;font-size:13px}.setup{margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}.setup summary{color:var(--muted);cursor:pointer;text-align:center;font-size:13px} [hidden]{display:none!important}
</style>
</head><body><main class="card"><h1 class="brand">Medexera Attendance</h1><p>Sign in with your Medexera account</p>
<form id="login"><label for="username">Username</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="signin">Sign in</button><div class="message" id="login-message" role="status"></div></form>
<details class="setup"><summary>First-time Admin setup</summary><form id="bootstrap"><label for="setup-token">One-time setup token</label><input id="setup-token" type="password" autocomplete="off" required><button id="setup-button">Continue to initial setup</button><div class="message" id="setup-message" role="status"></div></form></details>
<details class="setup"><summary>Admin password recovery</summary><form id="recover"><label for="recovery-token">One-time recovery token</label><input id="recovery-token" type="password" autocomplete="off" required><label for="recovery-password">New Admin password</label><input id="recovery-password" type="password" autocomplete="new-password" minlength="8" required><label for="recovery-confirm">Confirm new password</label><input id="recovery-confirm" type="password" autocomplete="new-password" minlength="8" required><button id="recover-button">Reset Admin password</button><div class="message" id="recovery-message" role="status"></div></form></details></main>
<script>
const $=s=>document.querySelector(s),show=(el,msg)=>el.textContent=msg;
$('#login').addEventListener('submit',async event=>{event.preventDefault();const button=$('#signin');button.disabled=true;show($('#login-message'),'');try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#username').value,password:$('#password').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Unable to sign in');sessionStorage.setItem('atxs',data.username);location.replace(data.mustChangePassword?'/change-password.html':'/index.html')}catch(error){show($('#login-message'),error.message||'Unable to sign in')}finally{button.disabled=false}});
$('#bootstrap').addEventListener('submit',async event=>{event.preventDefault();const button=$('#setup-button');button.disabled=true;show($('#setup-message'),'');try{const response=await fetch('/api/auth/bootstrap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:$('#setup-token').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Setup unavailable');sessionStorage.setItem('atxs','Admin');history.replaceState(null,'','/');location.replace(data.mustChangePassword?'/change-password.html':'/index.html')}catch(error){show($('#setup-message'),error.message||'Setup unavailable')}finally{button.disabled=false}});
$('#recover').addEventListener('submit',async event=>{event.preventDefault();const button=$('#recover-button');button.disabled=true;show($('#recovery-message'),'');if($('#recovery-password').value!==$('#recovery-confirm').value){show($('#recovery-message'),'The passwords do not match');button.disabled=false;return}try{const response=await fetch('/api/auth/recover-admin',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({token:$('#recovery-token').value,password:$('#recovery-password').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Admin recovery failed');sessionStorage.setItem('atxs',data.username);location.replace(data.mustChangePassword?'/change-password.html':'/index.html')}catch(error){show($('#recovery-message'),error.message||'Admin recovery failed')}finally{button.disabled=false}});
</script></body></html>
